[multiplayer]
    id=WOL_MP_Altar_of_Qzrk
    name= _ "4p — Altar of Q'zrk"
    map_file=4p_Altar_of_Qzrk.map
    random_start_time=no
    experience_modifier=70
    turns=-1
    allow_new_game=yes
    victory_when_enemies_defeated=yes
    description= _ "Only by sacrificing the two Chosen will you be freed. By Skele. Recommended Settings: Unlimited turns, 1 village gold, 70% XP, fog on, 75 starting gold."

    [options]
        [choice]
            id=wol_altar_qzrk_difficulty
            name= _ "Difficulty: "
            default=hard
            [item]
                name= _ "Easy"
                value=easy
            [/item]
            [item]
                name= _ "Normal"
                value=hard
            [/item]
        [/choice]
        [checkbox]
            id=wol_altar_qzrk_respawn_leader
            name= _ "Last unit standing"
            description= _ "If the leader is killed the most experienced unit takes command"
            default=yes
        [/checkbox]
    [/options]

    [story]
        [part]
            show_title=no
            scale_background=no
            background="portraits/drakes/inferno.webp"
            story= _ "The god Q'zrk demands a sacrifice. Why? Your town's lack of temple worship has upset him and he threatens to destroy you all. To repent you must survive his sadistic marathon of carnage and then sacrifice the two Chosen at his altars. Hail Q'zrk!"
        [/part]
    [/story]

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        side=1
        controller=ai
        no_leader=yes
        allow_player=no
        disallow_observers=yes
        team_name=bad
        user_team_name= _ "Chosen"
        team_lock=yes
        defeat_condition=never

        [ai]
            leader_value=1.0
            village_value=0.0
            aggression=1.0
            caution=0.0
            [avoid]
                terrain=*^V*
                owner_side=0
                [not]
                    [filter_adjacent]
                        [not]
                            side=1
                        [/not]
                    [/filter_adjacent]
                [/not]
            [/avoid]
        [/ai]
    [/side]

    [event]
        name=capture
        first_time_only=no

        [filter]
            side=1
        [/filter]

        [capture_village]
            x,y=$x1,$y1
            side=0
        [/capture_village]
    [/event]

    [side]
        side=2
        controller=human
        canrecruit=yes
        team_name=good
        user_team_name= _ "Sacrificers"
        team_lock=yes
        gold=75
        village_gold=1
        income=1
        fog=yes
        share_vision=all
        defeat_condition=no_units_left

        [ai]
            grouping=defensive
            villages_per_scout=9
            village_value=0.5
            aggression=0.2
            caution=0.9
        [/ai]
    [/side]

    [side]
        side=3
        controller=human
        canrecruit=yes
        team_name=good
        user_team_name= _ "Sacrificers"
        team_lock=yes
        gold=75
        village_gold=1
        income=1
        fog=yes
        share_vision=all
        defeat_condition=no_units_left

        [ai]
            grouping=defensive
            villages_per_scout=9
            village_value=0.5
            aggression=0.2
            caution=0.9
        [/ai]
    [/side]

    [side]
        side=4
        controller=human
        canrecruit=yes
        team_name=good
        user_team_name= _ "Sacrificers"
        team_lock=yes
        gold=75
        village_gold=1
        income=1
        fog=yes
        share_vision=all
        defeat_condition=no_units_left

        [ai]
            grouping=defensive
            villages_per_scout=9
            village_value=0.5
            aggression=0.2
            caution=0.9
        [/ai]
    [/side]

    [side]
        side=5
        controller=human
        canrecruit=yes
        team_name=good
        user_team_name= _ "Sacrificers"
        team_lock=yes
        gold=75
        village_gold=1
        income=1
        fog=yes
        share_vision=all
        defeat_condition=no_units_left

        [ai]
            grouping=defensive
            villages_per_scout=9
            village_value=0.5
            aggression=0.2
            caution=0.9
        [/ai]
    [/side]

    [event]
        name=prestart

        [objectives]
            side=0
            [objective]
                description= _ "Sacrifice the Chosen!"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of your team"
                condition=lose
                [show_if]
                    {VARIABLE_CONDITIONAL wol_altar_qzrk_respawn_leader equals yes}
                [/show_if]
            [/objective]
            [objective]
                description= _ "Death of your leader"
                condition=lose
                [show_if]
                    {VARIABLE_CONDITIONAL wol_altar_qzrk_respawn_leader not_equals yes}
                [/show_if]
            [/objective]
        [/objectives]

        {PLACE_IMAGE "items/altar.png" 4 25}
        {PLACE_IMAGE "items/altar.png~FL()" 40 4}

        {MODIFY_AI_DELETE_CANDIDATE_ACTION 1 main_loop villages}
    [/event]

    [event]
        name=last breath
        first_time_only=no

        [filter_condition]
            {VARIABLE_CONDITIONAL wol_altar_qzrk_respawn_leader equals yes}
        [/filter_condition]

        [filter]
            canrecruit=yes
            side=2,3,4,5
        [/filter]

        [store_unit]
            [filter]
                side=$unit.side
                canrecruit=no
            [/filter]
            variable=_all_units
        [/store_unit]

        {VARIABLE _index 0}

        [for]
            array=_all_units
            [do]
                [if]
                    {VARIABLE_CONDITIONAL _all_units[$i].level greater_than $_all_units[$_index].level}
                    [then]
                        {VARIABLE _index $i}
                    [/then]
                    [else]
                        [if]
                            {VARIABLE_CONDITIONAL _all_units[$i].level equals $_all_units[$_index].level}
                            [then]
                                [if]
                                    {VARIABLE_CONDITIONAL _all_units[$i].experience greater_than_equal_to $_all_units[$_index].experience}
                                    [then]
                                        {VARIABLE _index $i}
                                    [/then]
                                [/if]
                            [/then]
                        [/if]
                    [/else]
                [/if]
            [/do]
        [/for]

        [if]
            {VARIABLE_CONDITIONAL _all_units.length numerical_not_equals 0}
            [then]
                [modify_unit]
                    [filter]
                        id=$_all_units[$_index].id
                    [/filter]
                    canrecruit=yes
                [/modify_unit]

                [transform_unit]
                    id=$_all_units[$_index].id
                    transform_to=$_all_units[$_index].type
                [/transform_unit]
            [/then]
        [/if]
        {CLEAR_VARIABLE _all_units,_index}
    [/event]

    [event]
        name=attack

        [filter_second]
            type=Elvish Lady
            side=1
        [/filter_second]

        {WOL_SURVIVALS_KTV_MESSAGE (_ "Thank God you made it! Please destroy me!!!")}

        [event]
            name=attack
            delayed_variable_substitution=no

            [filter_second]
                type=Elvish Lady
                side=1
                [not]
                    id=$second_unit.id
                [/not]
            [/filter_second]

            {WOL_SURVIVALS_KTV_MESSAGE (_ "Oh please, just kill me now!!!")}
        [/event]
    [/event]

    [event]
        name=die
        first_time_only=no

        [filter]
            side=1
            type=Elvish Lady
        [/filter]

        [if]
            [not]
                [have_unit]
                    side=1
                    type=Elvish Lady
                [/have_unit]
            [/not]
            [then]
                [endlevel]
                    result=victory
                [/endlevel]
            [/then]
        [/if]
    [/event]

