#textdomain wesnoth-Survivals_WoL

#define WOL_SURVIVALS_SPAWN_MINION TYPE X Y
    [unit]
        type={TYPE}
        side=1
        x,y={X},{Y}
        generate_name=yes
        random_traits=no
        random_gender=yes
        upkeep=loyal
    [/unit]
#enddef

#define WOL_SURVIVALS_SPAWN_BOSS TYPE X Y
    [unit]
        type={TYPE}
        side=1
        x,y={X},{Y}
        generate_name=yes
        random_traits=no
        random_gender=yes
        upkeep=loyal
        {IS_HERO}
        [modifications]
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/unit]
#enddef

#define WOL_SURVIVALS_PIRATE X Y
    [unit]
        type="Pirate Galleon"
        side=1
        x,y={X},{Y}
        generate_name=yes
        random_traits=no
        upkeep=loyal
        [modifications]
            [object]
                silent=yes
                [effect]
                    apply_to=hitpoints
                    increase_total=300%
                    heal_full=yes
                [/effect]
                [effect]
                    apply_to=alignment
                    set=chaotic
                [/effect]
            [/object]
        [/modifications]
    [/unit]
#enddef

#define WOL_SURVIVALS_VoTA_ON_DIFFICULTY EASY HARD
    [switch]
        variable=wol_altar_qzrk_difficulty
        [case]
            value=easy
            {EASY}
        [/case]
        [case]
            value=hard
            {HARD}
        [/case]
    [/switch]
#enddef

