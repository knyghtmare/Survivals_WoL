#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_3p_murky_weathercast
    name= _ "3p — Murky Weathercast (Survival)"
    description= _ "Beyond the edge of the known world lies a valley shrouded in murk. Here the sky changes its mood at will, and the land changes with it, as clear skies give way to drought, rain, and snow. Three powers contest this valley, whose lands are drawn from “The Freelands”. Hold your ground against the waves that rise out of the mist, and break every foe that dares to come against you.

Note: You need to use the default map settings for the scenario to work right."
    experience_modifier=100
    map_file=murky_weathercast/3p_murky_weathercast_basic.map
    victory_when_enemies_defeated=no
    force_lock_settings=yes

    require_scenario=yes

    {DEFAULT_SCHEDULE_DAWN}

    mp_village_gold=1

    [side]
        side=1
        color=black
        team_name="revolt"
        user_team_name= _ "teamname^Revolt"
        allow_player=no
        disallow_observers=yes
        no_leader=yes
        controller="ai"
        defeat_condition=never
    [/side]

    [side]
        side=2
        color=black
        team_name="revolt"
        user_team_name= _ "teamname^Revolt"
        allow_player=no
        disallow_observers=yes
        no_leader=yes
        controller="ai"
        [ai]
            aggression=-4.0
            caution=0.99
            grouping=defensive
            village_value=12
            attack_depth=1
        [/ai]
    [/side]

    [side]
        side=3
        color=white
        canrecruit=yes
        team_name="human"
        user_team_name= _ "teamname^Human"
        controller="human"
        save_id="Player1"
        gold=75
        income=0
        gold_lock=yes
        income_lock=yes
        controller_lock=no
        team_lock=yes
        faction_lock=no
        leader_lock=no
        color_lock=no
        fog=yes
        share_vision=all
        [variables]
            dont_make_me_quick=yes
        [/variables]
    [/side]

    [side]
        side=4
        color=brown
        canrecruit=yes
        team_name="human"
        user_team_name= _ "teamname^Human"
        controller="human"
        save_id="Player2"
        gold=75
        income=0
        gold_lock=yes
        income_lock=yes
        controller_lock=no
        team_lock=yes
        faction_lock=no
        leader_lock=no
        color_lock=no
        fog=yes
        share_vision=all
        [variables]
            dont_make_me_quick=yes
        [/variables]
    [/side]
    [side]
        side=5
        color=green
        canrecruit=yes
        team_name="human"
        user_team_name= _ "teamname^Human"
        controller="human"
        save_id="Player3"
        gold=75
        income=0
        gold_lock=yes
        income_lock=yes
        controller_lock=no
        team_lock=yes
        faction_lock=no
        leader_lock=no
        color_lock=no
        fog=yes
        share_vision=all
        [variables]
            dont_make_me_quick=yes
        [/variables]
    [/side]
    [lua]
        code = <<
        wesnoth.dofile("~add-ons/Survivals_WoL/lua/murky_weathercast/3p_murky_weathercast.lua")
        >>
    [/lua]

    [event]
        name=prestart
        [store_unit]
            variable=leader
            [filter]
                side=3,4,5
            [/filter]
            kill=no
        [/store_unit]
        [if]
            [variable]
                name=leader.length
                less_than=3
            [/variable]
            [then]
                {VARIABLE lose_condition_string ( _ "Death of your leader")}
                {VARIABLE notes ( _ "Since your team has less than three leaders, the enemy waves will not be at full strength.")}
            [/then]
            [else]
                {VARIABLE lose_condition_string ( _ "Death of both of your team’s leaders")}
                {VARIABLE notes ( _ "Since your team has three leaders, the enemy waves will be at full strength.")}
            [/else]
        [/if]
        {CLEAR_VARIABLE leader}
        [music]
            name=wanderer.ogg
            ms_before=2000
        [/music]
        [music]
            name=battle.ogg
            ms_before=2000
            append=yes
        [/music]
        [music]
            name=breaking_the_chains.ogg
            play_once=yes
            immediate=yes
        [/music]

        [objectives]
            [objective]
                description= _ "Survive and defeat all enemy waves"
                condition=win
            [/objective]
            [objective]
                description=$lose_condition_string
                condition=lose
            [/objective]

            [note]
                description=$notes
            [/note]
        [/objectives]

        {CLEAR_VARIABLE lose_condition_string}
        {CLEAR_VARIABLE notes}
    [/event]

    [event]
        name=start
        [message]
            caption= _"Murky Weathercast — a random survival scenario"
            speaker=narrator
            image=misc/time-schedules/default/schedule-dawn.png
            message= _ "Your aim is to survive the spawning waves of units.

This is a modified version of Dark Forecast survival scenario with a new mapset and slightly altered code.

The spawning waves are randomly generated and will be different each time Murky Weathercast is played.

The weather will also change randomly, affecting the layout of the map."
        [/message]
        [message]
            side=3
            message= _"So this is the accursed valley — a land ours for the taking."
        [/message]
        [message]
            side=4
            message= _"The inhabitants are rumored to be a strange alliance of man and beast, and our claim is not going to be unopposed. We must be prepared for the surprises of this land."
        [/message]
        [message]
            side=5
            message= _"Then let us discover what lies in waiting and teach them not to oppose our claim."
        [/message]
    [/event]

    [event]
        name=last breath
        first_time_only=no
        [filter]
            side=3,4,5
            canrecruit=yes
        [/filter]
        [if]
            [have_unit]
                side=3,4,5
                canrecruit=yes
            [/have_unit]
            [then]
                [message]
                    speaker=unit
                    message= _"Ugh! How can this be? Defeated by mere barbarians! My gods have forsaken me..."
                [/message]
            [/then]
            [else]
                [music]
                    name=defeat.ogg
                    play_once=yes
                    immediate=yes
                [/music]
                [sound]
                    name=dwarf-laugh.wav
                [/sound]
                [message]
                    speaker=second_unit
                    message= _"Cheers of your enemy are the last thing you hear as you slip into death...their joy fills your last moments with pure hate."
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/else]
        [/if]
    [/event]

    [event]
        name=time over
        [music]
            name=defeat.ogg
            play_once=yes
            immediate=yes
        [/music]
        [sound]
            name=dwarf-laugh.wav
        [/sound]
        [message]
            side=1,2
            canrecruit=yes
            message= _ "The enemy cheers as a dark mist rises from the land, engulfing you. As ghostly wisps drain away your will, you realize that your time in this land is over."
        [/message]
    [/event]
    [options]
        [slider]
            id = "enemey_gold_factor"
            default = -10
            min = -40
            max = 40
            step = 10
            #textdomain wesnoth-lib
            name = _ "Difficulty"
            #textdomain wesnoth-multiplayer
            description =_  "Changes the gold worth of the enemy spawns by a certain percentage"
        [/slider]
    [/options]
[/multiplayer]
