# load afterlife scenarios here
#define AFTERLIFE_SIDE_HUMAN TEAM
	[side]
		controller=human
		gold=75
		fog=false
		shroud=false
		team_lock=true
		team_name={TEAM}
	[/side]
#enddef

#define AFTERLIFE_SIDE_AI TEAM
	[side]
		controller=ai
		defeat_condition=always
		allow_player=false
		fog=false
		shroud=false
		team_lock=true
		team_name={TEAM}
		[ai]
			aggression=0.995
			caution=0.005
			grouping=no
		[/ai]
	[/side]
#enddef

#define AFTERLIFE_DEFENSE_OBJECTIVES
	[objectives]
		[objective]
			description=_"Death of enemy Leader"
			condition=win
		[/objective]
		[objective]
			description=_"Death of your Leader"
			condition=lose
		[/objective]
	[/objectives]
#enddef

[multiplayer]
	id="wol_survivals_afterlife_survival"
	name=_"2p — Afterlife (Survival)"
	description=_"Your units are copied to the enemy side every two turns. The copies grow stronger each turn, so survive longer than your opponent."
	map_file=2p_Afterlife.map
	experience_modifier=100
	random_start_time=yes
	turns=-1
	{DEFAULT_SCHEDULE}
	{DEFAULT_MUSIC_PLAYLIST}

	[event]
		name=preload
		first_time_only=no
		[lua]
			code=<< wesnoth.dofile("~add-ons/Survivals_WoL/lua/afterlife.lua") >>
		[/lua]
		[lua]
			code="afterlife.init_defense()"
		[/lua]
		{AFTERLIFE_DEFENSE_OBJECTIVES}
	[/event]

	{AFTERLIFE_SIDE_HUMAN West}
	{AFTERLIFE_SIDE_AI East}
	{AFTERLIFE_SIDE_HUMAN East}
	{AFTERLIFE_SIDE_AI West}
[/multiplayer]

[multiplayer]
	id="wol_survivals_afterlife_race"
	name=_"2p — Afterlife Race"
	description=_"Enemy waves spawn each time you pass a ___N%___ label. Higher barriers produce stronger copies, so be the first to destroy all waves."
	map_file=2p_Afterlife_Race.map
	experience_modifier=90
	random_start_time=yes
	turns=-1
	{DEFAULT_SCHEDULE}
	{DEFAULT_MUSIC_PLAYLIST}

	[event]
		name=preload
		first_time_only=no
		[lua]
			code=<< wesnoth.dofile("~add-ons/Survivals_WoL/lua/afterlife.lua") >>
		[/lua]
		[lua]
			code="afterlife.init_race()"
		[/lua]
		[objectives]
			[note]
				description=_"Waves spawn each time you pass a ___N%___ label."
			[/note]
			[note]
				description=_"A wave consists of enemy units copied and controlled by AI. The higher the barrier, the stronger the copies."
			[/note]
			[objective]
				description=_"Be the first to destroy all waves."
				condition=win
			[/objective]
			[objective]
				description=_"Enemy side destroys all waves first."
				condition=lose
			[/objective]
		[/objectives]
	[/event]

	[options]
		[slider]
			name=_"Wave count"
			id="afterlife_wave_count_"
			default=10
			min=10
			max=15
			step=1
		[/slider]
	[/options]

	{AFTERLIFE_SIDE_HUMAN West}
	{AFTERLIFE_SIDE_AI East}
	{AFTERLIFE_SIDE_HUMAN East}
	{AFTERLIFE_SIDE_AI West}
[/multiplayer]

[multiplayer]
	id="wol_survivals_afterlife_4p"
