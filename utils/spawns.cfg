#define WOL_WAVE TURN_NUMBER WAVE_ACTIONS
    [event]
        name=turn refresh
        first_time_only=no
        [if]
            [variable]
                name=side_number
                equals=1
            [/variable]
            [and]
                [variable]
                    name=turn_number
                    equals={TURN_NUMBER}
                [/variable]
            [/and]
            [then]
                {WAVE_ACTIONS}
                {SET_LABEL 14 0 "$next_wave_label"}
                {SET_LABEL 14 21 "$next_wave_label"}
            [/then]
        [/if]
    [/event]
#enddef
