#textdomain wesnoth
#Spawning macros for Orocia and Deep Shrine

#define WOL_UNIT TYPE X Y
    [unit]
        side=4
        type={TYPE}
        x={X}
        y={Y}
        moves=0
        random_traits=no
        placement=map
        passable=yes
    [/unit]
#enddef

