#define WOL_VS_SURVIVAL_MIDDLE_OPENS TURN
	{VARIABLE map_open_middle_turn {TURN}}
	{WOL_VS_SURVIVAL_NEW_WAVE {TURN} (_"Middle Opens") ()}
#enddef

#define WOL_VS_SURVIVAL_MAP_OPEN_MIDDLE_EVENT
[event]
	name=new turn
	first_time_only=no

	{IF_VAR turn_number equals $map_open_middle_turn (
	[then]
		{WOL_VS_SURVIVAL_MAP_OPEN_MIDDLE}
	[/then]
	)}
[/event]
#enddef

#define WOL_VS_SURVIVAL_MODDABLE_WAVES_EVENT
	[event]
		name=side turn
		first_time_only=no
		
		{IF_VAR wave_mod not_equals yes (
		[then]
			{WOL_VS_SURVIVAL_WAVES}
		[/then]
		)}
	[/event]
#enddef

#define WOL_VS_SURVIVAL_NEW_WAVE TURN SPAWN_PREVIEW_LABEL SPAWNS
#preview label
	[if]
	[variable]
		name=preview_label_update
		boolean_equals=true
	[/variable]
	[then]
		{VARIABLE preview_label {SPAWN_PREVIEW_LABEL}}
		{VARIABLE preview_turn  {TURN}}
		{VARIABLE preview_label_update false}
	[/then]
	[/if]

#put enemies and preview ememy spawn labels on map
	[if]
	[variable]
		name=preview_turn
		equals={TURN}
	[/variable]
	[then]
		{SPAWNS}
	[/then]
	[/if]
#enddef

#define WOL_VS_SURVIVAL_SPAWN TYPE X Y
	{WOL_VS_SURVIVAL_DO_SPAWN {TYPE} {X} {Y} ()}
#enddef

#define WOL_VS_SURVIVAL_SPAWN_WML TYPE X Y WML
	{WOL_VS_SURVIVAL_DO_SPAWN {TYPE} {X} {Y} {WML}}
#enddef

#define WOL_VS_SURVIVAL_DO_SPAWN TYPE X Y WML
	{VARIABLE xs {X}}
	{VARIABLE ys {Y}}
	[unit]
		to_variable=wave_unit
		type={TYPE}
		random_traits=no
		random_gender=yes
		{WML}
	[/unit]
	[fire_event]
		name=spawn
	[/fire_event]
#enddef

#define WOL_VS_SURVIVAL_PLACE_WAVE_UNIT SIDE X Y
	{VARIABLE wave_unit.side {SIDE}}
	[unstore_unit]
		variable=wave_unit
		find_vacant=yes
		x={X}
		y={Y}
	[/unstore_unit]
	#fix up duplicate IDs for multiple unstores
	[unit]
		to_variable=temp_unit
		type=$wave_unit.type
		random_traits=no
		gender=$wave_unit.gender
	[/unit]
	{VARIABLE wave_unit.id $temp_unit.id}
	{VARIABLE wave_unit.underlying_id $temp_unit.underlying_id}
	{CLEAR_VARIABLE temp_unit}
#enddef


