#textdomain wesnoth-units

#define VS_SURVIVAL_VERSION
2.5.0#enddef

#define START_SETTINGS
	{MORNING}
	{AFTERNOON}
	{DUSK}
	{FIRST_WATCH}
	{SECOND_WATCH}
	{DAWN}

	{DEFAULT_MUSIC_PLAYLIST}

	turns="-1"
	experience_modifier=70%

	victory_when_enemies_defeated=yes
	random_start_time=no
#enddef

#define START_DESCRIPTION PLAYERS
description= _ "{PLAYERS} - vs Survival

Last longer than your opponent to win.
Enemy spawns come around every 3 turns until around turn 40, where the middle opens up.

Created by: Coffee"
#enddef

